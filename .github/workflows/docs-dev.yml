name: 📚 Development documentation

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  # Keep manifest generation and deployment atomic with other Pages workflows.
  group: docs-gh-pages
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'push'
        id: filter
        with:
          base: ${{ github.ref }}
          filters: .github/filters.yml

  build:
    name: Build documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    outputs:
      manifest-artifact-id: ${{ steps.upload-manifest.outputs.artifact-id }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: 🟨 Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: docs

      - name: 📝 Build docs
        env:
          DOCS_VERSIONED_BUILD: "true"
          DOCS_VERSION_KIND: development
        run: pixi run -e docs doc-build

      - name: 🔄 Ensure development version in manifest
        run: pixi run -e docs doc-version-manifest-dev

      - name: 📦 Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/build/html
          retention-days: 1

      - name: 📦 Upload version manifest
        id: upload-manifest
        if: hashFiles('docs/version-manifest/versions.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: docs-version-manifest
          path: docs/version-manifest
          retention-days: 1

  deploy:
    name: Deploy development documentation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: 📥 Download documentation
        uses: actions/download-artifact@v8
        with:
          name: docs-html
          path: docs/build/html

      - name: 📥 Download version manifest
        if: needs.build.outputs.manifest-artifact-id != ''
        uses: actions/download-artifact@v8
        with:
          name: docs-version-manifest
          path: docs/version-manifest

      - name: Initialize GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/pages-root
          clean: false
          force: false
          attempt-limit: 5

      - name: 🚀 Deploy development documentation
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/build/html
          target-folder: dev
          force: false
          attempt-limit: 5

      - name: 🚀 Deploy version manifest if needed
        if: needs.build.outputs.manifest-artifact-id != ''
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/version-manifest
          clean: false
          force: false
          attempt-limit: 5
