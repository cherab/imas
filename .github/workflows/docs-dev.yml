name: 📚 Development documentation

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: docs-development
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: 🟨 Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          environments: docs

      - name: 📝 Build docs
        env:
          DOCS_VERSIONED_BUILD: "true"
          DOCS_VERSION_KIND: development
        run: pixi run -e docs doc-build

      - name: 📦 Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/build/html
          retention-days: 1

  deploy:
    name: Deploy development documentation
    needs: build
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: 📥 Download documentation
        uses: actions/download-artifact@v8
        with:
          name: docs-html
          path: docs/build/html

      - name: Initialize GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/pages-root
          clean: false
          force: false
          attempt-limit: 5

      - name: 🚀 Deploy development documentation
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/build/html
          target-folder: dev
          force: false
          attempt-limit: 5

      - name: 🔄 Ensure development version in manifest
        id: manifest
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          if git show refs/remotes/origin/gh-pages:versions.json | python -c 'import json, sys; assert any(item["version"] == "dev" for item in json.load(sys.stdin))'; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            mkdir -p docs/pages-snapshot docs/version-manifest
            git archive refs/remotes/origin/gh-pages | tar -x -C docs/pages-snapshot
            python docs/generate_versions.py docs/pages-snapshot docs/version-manifest/versions.json
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Deploy version manifest if needed
        if: steps.manifest.outputs.update == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/version-manifest
          clean: false
          force: false
          attempt-limit: 5
