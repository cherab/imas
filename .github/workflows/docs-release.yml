name: 📚 Versioned documentation

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  # Keep manifest generation and deployment atomic with other Pages workflows.
  group: docs-gh-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: 🟨 Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: docs

      - name: 📝 Build docs
        env:
          DOCS_VERSIONED_BUILD: "true"
          DOCS_VERSION_KIND: release
        run: pixi run -e docs doc-build

      - name: 🔄 Generate version manifest
        run: pixi run -e docs doc-version-manifest-release

      - name: 📦 Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/build/html
          retention-days: 1

      - name: 📦 Upload version manifest
        uses: actions/upload-artifact@v7
        with:
          name: docs-version-manifest
          path: docs/version-manifest
          retention-days: 1

  deploy:
    name: Deploy versioned documentation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: 📥 Download documentation
        uses: actions/download-artifact@v8
        with:
          name: docs-html
          path: docs/build/html

      - name: 📥 Download version manifest
        uses: actions/download-artifact@v8
        with:
          name: docs-version-manifest
          path: docs/version-manifest

      - name: Resolve release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Initialize GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/pages-root
          clean: false
          force: false
          attempt-limit: 5

      - name: 🚀 Deploy versioned documentation
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/build/html
          target-folder: ${{ steps.release.outputs.version }}
          force: false
          attempt-limit: 5

      - name: 🚀 Deploy version manifest and latest redirect
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/version-manifest
          clean: false
          force: false
          attempt-limit: 5
